name: CI

# Har bir push va PR da. `main` ga tegishli har qanday oʻzgarish
# tekshiruvdan oʻtadi — shu paytgacha 1000 dan ortiq test QOʻLDA
# ishga tushirilardi va ular vaqti-vaqti bilan oʻtkazib yuborilardi.
on:
  push:
    branches: [main]
  pull_request:

# Ketma-ket ikki push boʻlsa, birinchisini toʻxtatamiz: eskirgan
# natijani kutish ham, uning uchun pul toʻlash ham keraksiz.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ishlab chiqish mashinasidagi versiya bilan BIR XIL. Boshqa versiya
  # tanlansa, faqat CI da yiqiladigan xatolar paydo boʻladi va ularni
  # lokal takrorlab boʻlmaydi.
  NODE_VERSION: '24'

jobs:
  # ------------------------------------------------------------------
  #  Backend: lint, tur tekshiruvi, build va unit testlar
  #  Bazasiz — bu testlar mock bilan ishlaydi va tez qaytadi.
  # ------------------------------------------------------------------
  api:
    name: API (lint, tsc, 224 unit test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace=@karvon/api

      - name: Build (tur tekshiruvi ham shu yerda)
        run: npm run build --workspace=@karvon/api

      - name: Unit testlar
        run: npm test --workspace=@karvon/api

  # ------------------------------------------------------------------
  #  Admin panel
  # ------------------------------------------------------------------
  admin:
    name: Admin panel (lint, tsc, 188 test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace=@karvon/admin

      - name: Tur tekshiruvi
        run: npm run typecheck --workspace=@karvon/admin

      - name: Testlar
        run: npm test --workspace=@karvon/admin

      - name: Build
        run: npm run build --workspace=@karvon/admin

  # ------------------------------------------------------------------
  #  Mobil ilova — analiz va unit/widget testlar
  #  Integratsiya testlari alohida ishda (ular API talab qiladi).
  # ------------------------------------------------------------------
  mobile:
    name: Mobil (analyze, 337 test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: apps/mobile

      - name: Analiz
        run: flutter analyze
        working-directory: apps/mobile

      - name: Unit va widget testlar
        run: flutter test
        working-directory: apps/mobile

  # ------------------------------------------------------------------
  #  Android reliz yigʻishi. Gradle sozlamasi (ruxsatlar, desugaring,
  #  imzo sharti) haqiqatda yigʻilishini tekshiradi — ishlab chiqish
  #  mashinasida Android SDK yoʻq, bu yagona tekshiruv.
  #  Kalit va Firebase fayli yoʻq: debug imzo bilan, pushsiz yigʻiladi.
  # ------------------------------------------------------------------
  android:
    name: Android (reliz APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reliz APK
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.example.uz/v1 \
            --dart-define=WS_URL=https://api.example.uz

      - name: Manifest — identifikator va INTERNET ruxsati
        # Flutter namunasida INTERNET faqat debug manifestida: usiz reliz
        # ilova serverga ulana olmaydi va buni faqat telefonda koʻrardik
        working-directory: apps/mobile
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$aapt" dump permissions "$apk" | tee permissions.txt
          grep -q 'android.permission.INTERNET' permissions.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' permissions.txt
          "$aapt" dump badging "$apk" | grep -q "package: name='uz.karvon.app'"
          ls -lh "$apk"

  # ------------------------------------------------------------------
  #  Docker tasvirlari — ishlab chiqarishga AYNAN shular chiqadi.
  #
  #  Ishlab chiqish mashinasida Docker ishlamaydi (WSL taqsimoti yoʻq),
  #  shuning uchun tasvirlar faqat shu yerda tekshiriladi: yigʻiladi,
  #  ichida kerakli fayllar borligi, prod rejimida haqiqiy Postgres,
  #  Redis va MinIO bilan koʻtarilishi va admin panel sarlavhalari.
  # ------------------------------------------------------------------
  docker:
    name: Docker (API va admin tasvirlari, prod compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy skriptlari (shellcheck)
        # Serverda birinchi marta ishga tushganda yiqiladigan skript —
        # eng yomon payt. Xatolarning katta qismini shu yerda ushlaymiz
        run: |
          shellcheck -S warning \
            scripts/deploy.sh scripts/rollback.sh scripts/backup-db.sh \
            scripts/restore-db.sh scripts/osrm-prepare.sh scripts/generate-secrets.sh \
            deploy/backup-loop.sh

      - name: Prod compose sintaksisi
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config -q

      - uses: docker/setup-buildx-action@v3

      - name: API tasviri
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: karvon-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Admin tasviri
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          load: true
          tags: karvon-admin:ci
          build-args: VITE_API_BASE_URL=https://api.example.uz/v1
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: API tasvirida migrator va admin skripti bor, root emas
        run: |
          docker run --rm --entrypoint sh karvon-api:ci -c '
            set -e
            test -f dist/main.js
            test -f dist/infra/database/migrator.js
            test -f dist/scripts/create-admin.js
            ls db/migrations | head -3
            test "$(id -u)" != "0"
            echo "foydalanuvchi: $(id -un)"
          '

      - name: API tasviri prod rejimida koʻtariladi
        run: |
          docker network create karvon
          docker run -d --name pg --network karvon \
            -e POSTGRES_USER=karvon -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=karvon \
            postgis/postgis:16-3.4
          docker run -d --name redis --network karvon redis:7-alpine
          docker run -d --name minio --network karvon \
            -e MINIO_ROOT_USER=karvon -e MINIO_ROOT_PASSWORD=karvon-ci-secret \
            minio/minio:latest server /data

          for i in $(seq 1 60); do
            docker exec pg pg_isready -U karvon >/dev/null 2>&1 && break
            sleep 1
          done

          # `staging` — prod validatsiyasi toʻliq ishlaydi (JWT kalitlari,
          # SMS, shifrlash, OSRM majburiy). `development` ISHLATILMAYDI:
          # u logger uchun pino-pretty (dev bogʻliqlik) ni talab qiladi va
          # tasvirda yoʻq. Kalitlar shu yerda bir martalik yaratiladi
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt.key 2>/dev/null
          openssl pkey -in jwt.key -pubout -out jwt.pub
          cat > ci.env <<EOF
          NODE_ENV=staging
          DATABASE_URL=postgresql://karvon:ci@pg:5432/karvon
          REDIS_URL=redis://redis:6379
          OTP_PEPPER=ci-pepper-kamida-16-belgi-uzun
          JWT_PRIVATE_KEY=$(base64 -w0 jwt.key)
          JWT_PUBLIC_KEY=$(base64 -w0 jwt.pub)
          FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)
          SMS_PROVIDER=eskiz
          ESKIZ_EMAIL=ci@example.uz
          ESKIZ_PASSWORD=ci
          S3_ENDPOINT=http://minio:9000
          S3_BUCKET=karvon
          S3_ACCESS_KEY=karvon
          S3_SECRET_KEY=karvon-ci-secret
          OSRM_BASE_URL=http://osrm.invalid:5000
          EOF

          # Migratsiya va seed — deploy.sh aynan shunday chaqiradi
          docker run --rm --network karvon --env-file ci.env karvon-api:ci node dist/infra/database/migrator.js up
          docker run --rm --network karvon --env-file ci.env karvon-api:ci node dist/infra/database/migrator.js seed

          docker run -d --name api --network karvon -p 3000:3000 --env-file ci.env karvon-api:ci

          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health/ready >/dev/null && break
            sleep 1
          done
          if ! curl -sf http://localhost:3000/health/ready; then
            echo "::error::API tasviri sogʻlom holatga kelmadi"
            docker logs api 2>&1 | tail -60
            exit 1
          fi
          echo

          # Prod rejimida Swagger yopiq: API tuzilmasi ochiq koʻrinmaydi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/docs)
          [ "$code" = "404" ] || { echo "::error::/docs prod rejimida ochiq ($code)"; exit 1; }

          # Admin skripti ham tasvirda ishlaydi (TOTP kaliti chiqadi)
          docker run --rm --network karvon --env-file ci.env karvon-api:ci \
            node dist/scripts/create-admin.js --email=ci@karvon.uz --password='CI-parol-2026!' --name='CI' \
            | grep -qi 'otpauth://' || { echo "::error::create-admin tasvirda ishlamadi"; exit 1; }

      - name: Admin tasviri — SPA yoʻnalishi, kesh va xavfsizlik sarlavhalari
        run: |
          docker run -d --name admin -p 8081:80 \
            -e API_ORIGIN=https://api.example.uz -e FILES_ORIGIN=https://files.example.uz \
            karvon-admin:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8081/healthz >/dev/null && break; sleep 1; done

          # Chuqur havola ham ilovani qaytaradi (SPA)
          curl -sf http://localhost:8081/orders/123 | grep -q '<div id="root">'

          headers=$(curl -sI http://localhost:8081/)
          echo "$headers" | grep -qi "content-security-policy:.*connect-src 'self' https://api.example.uz" \
            || { echo "::error::CSP da API manzili yoʻq"; echo "$headers"; exit 1; }
          echo "$headers" | grep -qi 'x-frame-options: deny'
          echo "$headers" | grep -qi 'cache-control: no-cache'

          # Xeshlangan fayl: uzoq kesh VA xavfsizlik sarlavhalari saqlangan
          # (nginx'da location ichidagi add_header ularni jimgina oʻchirardi)
          asset=$(curl -s http://localhost:8081/ | grep -oE '/assets/[^"]+\.js' | head -1)
          asset_headers=$(curl -sI "http://localhost:8081$asset")
          echo "$asset_headers" | grep -qi 'cache-control: max-age=31536000'
          echo "$asset_headers" | grep -qi 'content-security-policy'

      - name: Konteyner loglari (yiqilganda)
        if: failure()
        run: |
          for name in api admin pg minio; do
            echo "::group::$name"
            docker logs "$name" 2>&1 | tail -40 || true
            echo "::endgroup::"
          done

  # ------------------------------------------------------------------
  #  Uchidan-uchiga: haqiqiy Postgres, Redis, MinIO va ishlab turgan API
  #
  #  MINIO SHU YERDA BOR — lokal muhitda Docker koʻtarilmagani uchun
  #  hujjat yuklash testlari oʻtkazib yuborilardi. CI da ular
  #  HAQIQATAN ishga tushadi.
  # ------------------------------------------------------------------
  integration:
    name: Uchidan-uchiga (425 backend + 81 mobil)
    runs-on: ubuntu-latest

    # ISH DARAJASIDA, qadam darajasida emas.
    #
    # Skriptlar bazaga toʻgʻridan-toʻgʻri ham murojaat qiladi va
    # `PGURL` ni oʻqiydi; uning standart qiymati DEV PAROLIGA qotib
    # yozilgan (`scripts/lib/fixtures.js`). Avval bu faqat backend
    # qadamiga berilgan edi va mobil testlar chaqiradigan
    # `order-fixture.js` bazaga ulana olmay, unga bogʻliq 30 ta test
    # yiqilgan. Ish darajasida berilsa, kelajakda qoʻshiladigan qadam
    # ham uni avtomatik oladi.
    env:
      PGURL: postgresql://karvon:karvon_ci@localhost:5432/karvon

    services:
      postgres:
        # PostGIS majburiy: geo soʻrovlar (`ST_DWithin`, `ST_MakePoint`)
        # oddiy Postgres'da ishlamaydi
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: karvon
          POSTGRES_PASSWORD: karvon_ci
          POSTGRES_DB: karvon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U karvon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      minio:
        # `edge-cicd` — MinIO ning CI uchun chiqaradigan tegi: u
        # `minio server /data` ni oʻzi ishga tushiradi. Oddiy
        # `minio/minio` tegida buyruq berish kerak, GitHub xizmat
        # konteynerlari esa `command` ni qoʻllab-quvvatlamaydi.
        image: minio/minio:edge-cicd
        env:
          MINIO_ROOT_USER: karvon
          MINIO_ROOT_PASSWORD: karvon_ci_secret
        ports: ['9000:9000']
        # Sogʻliq tekshiruvi konteyner ichida emas, RUNNER tomonida
        # (quyidagi qadam). Sabab: `--health-cmd` konteyner ichidagi
        # buyruqni ishlatadi va u yerda `curl` borligiga kafolat yoʻq —
        # tasvir oʻzgarsa CI tushunarsiz sababdan yiqilardi.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: npm ci

      - name: Muhit sozlamalari
        run: |
          # `.env.example` DAN BOSHLAYMIZ, noldan yozmaymiz.
          #
          # Birinchi urinishda aynan shu xato boʻldi: fayl qoʻlda
          # yozilgan va Click/Payme kalitlari unutilgan edi. Server
          # imzoni boʻsh kalit bilan hisobladi, test skripti esa oʻz
          # zaxira qiymati bilan — imzolar mos kelmadi va toʻlov
          # toʻplami yiqildi. Namunadan nusxa olinsa, sxemaga yangi
          # oʻzgaruvchi qoʻshilganda CI uni AVTOMATIK oladi.
          cp .env.example .env

          # Faqat farq qiladigan joylar ustidan yoziladi.
          # `dotenv` da takroriy kalitda OXIRGISI gʻolib boʻladi.
          cat >> .env <<'ENVFILE'

          # ---- CI ustidan yozadigan qiymatlar ----
          DATABASE_URL=postgresql://karvon:karvon_ci@localhost:5432/karvon
          S3_SECRET_KEY=karvon_ci_secret
          # `info` — `warn` emas: soʻrov loglari (status kodlari bilan)
          # aynan `info` darajasida yoziladi va yiqilish sababini
          # aniqlashda ular hal qiluvchi. `warn` da faqat xatolar
          # koʻrinardi va 429 bilan 500 ni ajratib boʻlmasdi
          LOG_LEVEL=info

          # Kunlik OTP chegarasi namunada 10 — bu bitta toʻplamga ham
          # yetmaydi. Sxemadagi maksimum 200 (`env.schema.ts`), undan
          # kattasi yozilsa ilova umuman ishga tushmaydi.
          OTP_MAX_PER_DAY_PER_IP=200

          # Admin paneli kalitsiz ishlamaydi ("Admin paneli sozlanmagan"),
          # namunada esa u boʻsh. Kamida 32 belgi.
          ADMIN_JWT_SECRET=ci-admin-jwt-secret-32-belgidan-uzun

          # PSP imzolari: test skripti aynan shu qiymatlarni zaxira
          # sifatida ishlatadi (`payments-test.js`), server ham
          # shularni bilishi kerak — aks holda imzo mos kelmaydi
          CLICK_SERVICE_ID=12345
          CLICK_MERCHANT_ID=54321
          CLICK_SECRET_KEY=test_click_secret
          PAYME_MERCHANT_ID=test_merchant
          PAYME_MERCHANT_KEY=test_payme_key
          PAYMENTS_ALLOW_SIMULATION=true

          # Mobil ilova web-server rejimida shu portdan keladi
          CORS_ORIGINS=http://localhost:5173,http://localhost:3001,http://localhost:8090
          ENVFILE

          # Sozlamalar toʻgʻri oʻqilishini DARHOL tekshiramiz: aks holda
          # xato faqat testlar yiqilganda maʼlum boʻladi
          node -e "
            const env = require('dotenv').parse(require('fs').readFileSync('.env'));
            const required = ['DATABASE_URL','REDIS_URL','ADMIN_JWT_SECRET','CLICK_SECRET_KEY','PAYME_MERCHANT_KEY'];
            const missing = required.filter((key) => !env[key]);
            if (missing.length) { console.error('Yetishmayapti:', missing.join(', ')); process.exit(1); }
            console.log('.env tayyor:', Object.keys(env).length, 'ta oʻzgaruvchi');
          "

      - name: MinIO tayyorligini kutish
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live

      - name: Migratsiya va seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Admin hisobi
        # `admin-test.js` `admin@karvon.uz` ning parol xeshidan
        # namuna sifatida foydalanadi va aynan shu parol bilan
        # kiradi — qiymat skriptning oʻzida yozilgan, yaʼni bu
        # test fikstura, maxfiy soʻz emas.
        run: npm run admin:create -- --email=admin@karvon.uz --password='Karvon!Admin2026' --name='CI Admin'

      - name: API ni qurish va ishga tushirish
        run: |
          npm run build --workspace=@karvon/api
          # Log faylga: yiqilganda uni annotatsiyaga chiqaramiz.
          # Fon jarayonining chiqishi qadam logida qoladi, u esa
          # tizimga kirmagan odamga koʻrinmaydi
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          # Sogʻliq tekshiruvi: `sleep 10` ishonchsiz — sekin ishda
          # yetmaydi, tez ishda esa behuda kutish
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/health

      - name: Backend uchidan-uchiga (10 toʻplam)
        run: bash scripts/test-all.sh

      - name: OTP limitlarini tozalash
        # Kunlik chegara IP boʻyicha (200) va butun CI bitta IP dan
        # ishlaydi. Backend toʻplami undan katta qismini yeydi —
        # mobil testlar oldidan hisoblagichni nolga qaytaramiz
        run: node scripts/reset-rate-limits.js

      - name: Mobil integratsiya testlari
        # MinIO ishlab turgani uchun hujjat yuklash testlari ham
        # HAQIQATAN ishga tushadi — lokal muhitda ular oʻtkazib
        # yuborilardi (Docker koʻtarilmagan).
        #
        # YIQILGAN TESTLAR ANNOTATSIYA sifatida chiqadi: Actions
        # loglarini koʻrish uchun GitHub'ga kirish kerak, annotatsiya
        # esa ish sahifasida hammaga ochiq turadi. Usiz "31 ta test
        # yiqildi" degan xabardan nariga oʻtib boʻlmaydi.
        run: |
          set -o pipefail
          flutter pub get
          # `--reporter expanded` MAJBURIY: standart reporter progressni
          # `\r` bilan bitta qatorga qayta yozadi va faylda hamma narsa
          # bitta ulkan qator boʻlib qoladi — oldingi urinishda test
          # nomlarini ajratib boʻlmagani shundan
          if flutter test test_integration --reporter expanded \
              --dart-define=API_BASE_URL=http://localhost:3000/v1 \
              --dart-define=WS_URL=http://localhost:3000 2>&1 | tee /tmp/mobile.log; then
            exit 0
          fi

          echo "::error::Mobil integratsiya testlari yiqildi"

          grep -E '\[E\]$' /tmp/mobile.log \
            | sed -E 's/^[0-9]+:[0-9]+ \+[0-9]+( -[0-9]+)?: //; s/ \[E\]$//' \
            | sort -u | head -15 \
            | while IFS= read -r name; do echo "::error::YIQILDI — $name"; done

          # Birinchi xatoning sababi: test nomi NIMA yiqilganini
          # aytadi, bu esa NEGA ekanini
          grep -A6 -m1 -E '\[E\]$' /tmp/mobile.log | tail -6 \
            | while IFS= read -r line; do
                [ -n "$(echo "$line" | tr -d '[:space:]')" ] && echo "::error::sabab: $line"
              done

          exit 1
        working-directory: apps/mobile

      - name: API xatolari (yiqilganda)
        if: failure()
        # Server tomonidagi sabab — koʻpincha hal qiluvchi dalil:
        # 429 (limit) bilan 500 (kod xatosi) mijoz tomonidan bir xil
        # koʻrinadi. Annotatsiya tizimga kirmasdan ham oʻqiladi
        run: |
          echo "::group::API log (oxirgi 40 qator)"
          tail -40 /tmp/api.log || true
          echo "::endgroup::"

          # Status kodlari SONI bilan: bitta 429 tasodif, ellikta 429 —
          # sabab. Oldingi urinishda faqat kodlar roʻyxati chiqqan edi
          # va ular orasida testlar ATAYLAB chaqiradiganlari ham bor edi
          grep -oE '"statusCode":[0-9]+' /tmp/api.log 2>/dev/null \
            | sort | uniq -c | sort -rn | head -8 \
            | while IFS= read -r line; do echo "::error::javob kodlari: $line"; done || true

          grep -oE '"code":"[A-Z_]{3,40}"' /tmp/api.log 2>/dev/null \
            | sort | uniq -c | sort -rn | head -10 \
            | while IFS= read -r line; do echo "::error::xato kodlari: $line"; done || true
