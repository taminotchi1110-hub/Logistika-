services:
  postgres:
    # PostGIS bundled image — o'zimiz extension o'rnatib o'tirmaymiz
    image: postgis/postgis:16-3.4
    container_name: karvon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karvon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karvon_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-karvon}
      # Vaqt zonasi UTC — ilova mijoz tomonida Asia/Tashkent ga o'giradi
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-karvon} -d ${POSTGRES_DB:-karvon}']
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      # Dev uchun sekin so'rovlarni ko'rish — prodda bu qiymatlar boshqacha
      - postgres
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100

  redis:
    image: redis:7-alpine
    container_name: karvon-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-mos storage: hujjat, avatar, yuk fotolari
    image: minio/minio:latest
    container_name: karvon-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-karvon}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-karvon_dev_password}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    # Bazani brauzerdan ko'rish uchun (dev only)
    image: adminer:latest
    container_name: karvon-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
