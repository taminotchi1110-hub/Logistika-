services:
  postgres:
    # PostGIS bundled image — o'zimiz extension o'rnatib o'tirmaymiz
    image: postgis/postgis:16-3.4
    container_name: karvon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karvon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karvon_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-karvon}
      # Vaqt zonasi UTC — ilova mijoz tomonida Asia/Tashkent ga o'giradi
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-karvon} -d ${POSTGRES_DB:-karvon}']
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      # Dev uchun sekin so'rovlarni ko'rish — prodda bu qiymatlar boshqacha
      - postgres
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100

  redis:
    image: redis:7-alpine
    container_name: karvon-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # S3 mos fayl ombori: hujjat, avatar, yuk fotolari. Prod bilan bir xil
    # tasvir va ishga tushirish skripti (MinIO tasvirlarini tarqatishni
    # to'xtatgan — docs/19-deploy.md)
    image: chrislusf/seaweedfs:4.46
    container_name: karvon-s3
    restart: unless-stopped
    entrypoint: ['sh', '/s3-start.sh']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-karvon}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-karvon_dev_password}
    ports:
      - '${S3_PORT:-9000}:8333'
      # Fayllarni brauzerda ko'rish. Faqat shu kompyuterdan: filer S3
      # kalitlarini chetlab o'tadi
      - '127.0.0.1:${S3_FILER_PORT:-8888}:8888'
    volumes:
      - s3_data:/data
      - ./deploy/s3-start.sh:/s3-start.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '-so', '/dev/null', 'http://127.0.0.1:8333/']
      interval: 10s
      timeout: 5s
      retries: 12

  adminer:
    # Bazani brauzerdan ko'rish uchun (dev only)
    image: adminer:latest
    container_name: karvon-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  s3_data:
